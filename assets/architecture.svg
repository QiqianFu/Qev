<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="590" viewBox="0 0 1320 590" role="img" aria-labelledby="title desc">
<title id="title">How Qev chooses between answer options</title><desc id="desc">A support message is routed to Billing, Shipping, or Account. Each option gets a numeric summary vector, labelled e1, e2, or e3. The model compares these with the question summary and scores each option.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#929bad"/></marker></defs>
<rect x="1" y="1" width="1318" height="588" rx="20" fill="#fff" stroke="#e3e7ef"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="40" y="43" fill="#272a3e" font-size="23" font-weight="700">How Qev chooses an answer</text>
<text x="40" y="70" fill="#778096" font-size="14">Example: route a support message to Billing, Shipping, or Account · K = 3 answer options</text>
<g stroke="#929bad" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M220 185H276"/><path d="M452 185H491V128H523"/><path d="M452 185H523"/><path d="M491 185V242H523"/><path d="M734 128H786"/><path d="M734 185H786"/><path d="M734 242H786"/><path d="M952 128H981V172H1010"/><path d="M952 185H1010"/><path d="M952 242H981V202H1010"/><path d="M363 150V100H1090V136"/><path d="M1190 262V314H178V337"/></g>
<g fill="#f1f3fa" stroke="#dce0ec"><rect x="40" y="151" width="180" height="70" rx="12"/><rect x="276" y="151" width="176" height="70" rx="12"/></g>
<g fill="#eef8f5" stroke="#cee7de"><rect x="523" y="104" width="211" height="48" rx="9"/><rect x="523" y="161" width="211" height="48" rx="9"/><rect x="523" y="218" width="211" height="48" rx="9"/></g>
<g fill="#f2edff" stroke="#e0d5fa"><rect x="786" y="104" width="166" height="48" rx="9"/><rect x="786" y="161" width="166" height="48" rx="9"/><rect x="786" y="218" width="166" height="48" rx="9"/><rect x="1010" y="136" width="252" height="126" rx="12"/></g>
<g fill="#252a40" font-size="18" font-weight="600" text-anchor="middle"><text x="130" y="181">Input message</text><text x="364" y="181">Question</text><text x="628" y="134">Option 1 · Billing</text><text x="628" y="191">Option 2 · Shipping</text><text x="628" y="248">Option 3 · Account</text><text x="869" y="125" font-size="14">Option 1 summary</text><text x="869" y="182" font-size="14">Option 2 summary</text><text x="869" y="239" font-size="14">Option 3 summary</text><text x="1136" y="175" font-size="17">Question summary +</text><text x="1136" y="200" font-size="17">3 option summaries</text></g>
<g fill="#727a8e" font-size="13" text-anchor="middle"><text x="130" y="203">“I was charged twice.”</text><text x="364" y="203">Which team should help?</text><text x="680" y="93">question summary (vector h_q)</text><text x="869" y="143">vector e₁</text><text x="869" y="200">vector e₂</text><text x="869" y="257">vector e₃</text><text x="1136" y="235">4 vectors · 4,096 numbers each</text><text x="620" y="289">The model computes a context-aware summary for each answer option.</text></g>
<rect x="28" y="341" width="1264" height="192" rx="14" fill="#f8f7fd"/>
<text x="50" y="371" fill="#594992" font-size="14" font-weight="700" letter-spacing="1.5">TURN THE SUMMARIES INTO A DECISION · FP32 HEAD</text>
<g fill="#fff" stroke="#ddd6ef"><rect x="50" y="396" width="250" height="111" rx="10"/><rect x="355" y="396" width="250" height="111" rx="10"/><rect x="660" y="396" width="250" height="111" rx="10"/><rect x="965" y="396" width="300" height="111" rx="10"/></g>
<g stroke="#929bad" stroke-width="2" marker-end="url(#arrow)"><path d="M300 451H351"/><path d="M605 451H656"/><path d="M910 451H961"/></g>
<g fill="#333048" font-size="17" font-weight="600" text-anchor="middle"><text x="175" y="425">Compact the summaries</text><text x="480" y="425">Compare the options</text><text x="785" y="425">Pair with the question</text><text x="1115" y="425">Score each option</text></g>
<g fill="#717487" font-size="14" text-anchor="middle"><text x="175" y="454">Same projection: 4096 → 256</text><text x="175" y="481">applied to every summary</text><text x="480" y="454">Question + option summaries</text><text x="480" y="481">two layers of set attention</text><text x="785" y="454">Each option + the question</text><text x="785" y="481">256 + 256 = 512 numbers</text><text x="1115" y="454">Same scorer for every option</text><text x="1115" y="481">One score each → probabilities</text></g>
<text x="40" y="568" fill="#7a8192" font-size="13">A vector is a list of numbers encoding meaning. e₁, e₂ and e₃ are the contextual summaries of answer options 1, 2 and 3.</text>
</g></svg>
