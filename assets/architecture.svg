<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="590" viewBox="0 0 1320 590" role="img" aria-labelledby="title desc">
<title id="title">Qev candidate tree and set decision head</title><desc id="desc">Shared state and question branch into three candidates. Their readouts and the question readout are projected to 256 dimensions, compared by two set Transformer layers, and scored by a shared scalar function.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#929bad"/></marker></defs>
<rect x="1" y="1" width="1318" height="588" rx="20" fill="#fff" stroke="#e3e7ef"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="40" y="43" fill="#272a3e" font-size="23" font-weight="700">From a shared context to a distribution over candidates</text>
<text x="40" y="70" fill="#778096" font-size="14">Qev-9B · example with K = 3 · logical information flow</text>
<g stroke="#929bad" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M220 185H276"/><path d="M452 185H491V128H523"/><path d="M452 185H523"/><path d="M491 185V242H523"/><path d="M734 128H786"/><path d="M734 185H786"/><path d="M734 242H786"/><path d="M918 128H965V172H1010"/><path d="M918 185H1010"/><path d="M918 242H965V202H1010"/><path d="M363 150V100H1090V136"/><path d="M1190 262V314H178V337"/></g>
<g fill="#f1f3fa" stroke="#dce0ec"><rect x="40" y="151" width="180" height="70" rx="12"/><rect x="276" y="151" width="176" height="70" rx="12"/></g>
<g fill="#eef8f5" stroke="#cee7de"><rect x="523" y="104" width="211" height="48" rx="9"/><rect x="523" y="161" width="211" height="48" rx="9"/><rect x="523" y="218" width="211" height="48" rx="9"/></g>
<g fill="#f2edff" stroke="#e0d5fa"><rect x="786" y="104" width="132" height="48" rx="9"/><rect x="786" y="161" width="132" height="48" rx="9"/><rect x="786" y="218" width="132" height="48" rx="9"/><rect x="1010" y="136" width="252" height="126" rx="12"/></g>
<g fill="#252a40" font-size="18" font-weight="600" text-anchor="middle"><text x="130" y="181">State</text><text x="364" y="181">Question</text><text x="628" y="134">Candidate 1</text><text x="628" y="191">Candidate 2</text><text x="628" y="248">Candidate 3</text><text x="852" y="134">e₁</text><text x="852" y="191">e₂</text><text x="852" y="248">e₃</text><text x="1136" y="176">[ h_q, e₁, e₂, e₃ ]</text></g>
<g fill="#727a8e" font-size="13" text-anchor="middle"><text x="130" y="203">shared context</text><text x="364" y="203">instructions</text><text x="680" y="93">question readout h_q</text><text x="1136" y="206">4 readout vectors</text><text x="1136" y="229">4,096 channels each</text><text x="620" y="289">Final-layer sibling interaction is gated; other questions stay isolated.</text></g>
<rect x="28" y="341" width="1264" height="192" rx="14" fill="#f8f7fd"/>
<text x="50" y="371" fill="#594992" font-size="14" font-weight="700" letter-spacing="1.5">THE SET DECISION HEAD · FP32</text>
<g fill="#fff" stroke="#ddd6ef"><rect x="50" y="396" width="250" height="111" rx="10"/><rect x="355" y="396" width="250" height="111" rx="10"/><rect x="660" y="396" width="250" height="111" rx="10"/><rect x="965" y="396" width="300" height="111" rx="10"/></g>
<g stroke="#929bad" stroke-width="2" marker-end="url(#arrow)"><path d="M300 451H351"/><path d="M605 451H656"/><path d="M910 451H961"/></g>
<g fill="#333048" font-size="17" font-weight="600" text-anchor="middle"><text x="175" y="425">Shared projection</text><text x="480" y="425">Set attention × 2</text><text x="785" y="425">Pair each candidate</text><text x="1115" y="425">Shared scalar scorer</text></g>
<g fill="#717487" font-size="14" text-anchor="middle"><text x="175" y="454">LayerNorm · 4096 → 256</text><text x="175" y="481">question adds a role vector</text><text x="480" y="454">[1, K+1, 256] · 4 heads</text><text x="480" y="481">question ↔ candidates</text><text x="785" y="454">concat(cᵢ′, q′) → 512</text><text x="785" y="481">candidate first, question second</text><text x="1115" y="454">LN → Linear → GELU → Linear</text><text x="1115" y="481">512 → 256 → 1 · softmax over K</text></g>
<text x="40" y="568" fill="#7a8192" font-size="13">K changes the number of rows. The scoring function is shared across candidates and all three task types.</text>
</g></svg>
